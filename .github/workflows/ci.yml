name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --all-packages --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sharpa-model
          key: sharpa-model-${{ hashFiles('packages/a2a-robots-sharpa/src/a2a_robots_sharpa/model.py') }}
      - run: uv run python -m a2a_robots_sharpa.model ${{ runner.temp }}/sharpa-model
      - run: uv run pytest packages/a2a-robots-sharpa
        env:
          SHARPA_MODEL_DIR: ${{ runner.temp }}/sharpa-model
